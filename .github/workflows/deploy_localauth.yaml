name: Deploy localauth til dev

on:
  workflow_dispatch:

concurrency:
  group: deploy-localauth-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy localauth til dev-gcp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Deploy localauth
        uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/localauth.yaml
